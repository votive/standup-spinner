<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standup Spinner</title>
<meta name="description" content="Spin the wheel to pick who speaks next at standup.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="state-idle">
  <div class="bg-image" id="bgImage"></div>
  <div class="bg-scrim"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Standup Spinner</span>
    </div>
    <button type="button" class="btn btn-ghost" id="setupToggle" aria-expanded="false" aria-controls="setup">Setup</button>
  </header>

  <main class="stage" id="stage">
    <div class="wheel-area">
      <div class="wheel-wrap">
        <canvas id="wheel"></canvas>
        <button id="spinBtn" class="hub" type="button">
          <span class="hub-label">Spin</span>
        </button>
      </div>
      <p class="wheel-caption" id="caption"></p>
      <p class="away-strip" id="awayStrip" hidden></p>
    </div>

    <section class="speaker" id="speaker" aria-labelledby="speakerName">
      <div class="speaker-inner">
        <p class="eyebrow">Now speaking</p>
        <h1 class="speaker-name" id="speakerName"></h1>

        <ul class="prompts" id="prompts"></ul>

        <div class="timer" id="timer">
          <div class="clock" id="clock">0:00</div>
          <div class="track"><div class="fill" id="timerFill"></div></div>
          <div class="timer-controls">
            <button type="button" class="btn btn-primary" id="timerToggle">Start</button>
            <button type="button" class="btn" id="timerReset">Reset</button>
          </div>
        </div>
      </div>
    </section>

    <section class="endcard" id="endcard" aria-labelledby="endTitle">
      <div class="endcard-inner">
        <p class="eyebrow">That's standup</p>
        <h1 class="end-title" id="endTitle"></h1>
        <p class="end-sub" id="endSub"></p>
        <ol class="order" id="order"></ol>
        <div class="end-actions">
          <button type="button" class="btn btn-primary" id="newRound">New round</button>
          <button type="button" class="btn" id="copyLink">Copy board link</button>
        </div>
      </div>
    </section>
  </main>

  <aside class="setup" id="setup" aria-label="Setup" aria-hidden="true">
    <div class="setup-head">
      <h2>Setup</h2>
      <button type="button" class="btn btn-ghost" id="setupClose">Done</button>
    </div>

    <div class="field">
      <label for="roster">Participants — one per line</label>
      <textarea id="roster" rows="8" spellcheck="false" autocomplete="off"
                placeholder="Ayesha&#10;Tom B.&#10;Jo"></textarea>
      <p class="hint" id="rosterHint"></p>
      <p class="warn" id="dupWarn" hidden></p>
    </div>

    <div class="field">
      <p class="field-label">Here today</p>
      <div class="presence" id="presence"></div>
      <p class="hint">Unticking someone takes them off the wheel for this standup only. It never changes the board link.</p>
    </div>

    <div class="field">
      <label for="turnLength">Turn length</label>
      <div class="row">
        <input type="number" id="turnLength" min="15" max="3600" step="15" inputmode="numeric">
        <span class="unit">seconds</span>
      </div>
    </div>

    <div class="setup-actions">
      <button type="button" class="btn" id="copyLinkSetup">Copy board link</button>
    </div>
  </aside>
  <div class="scrim-click" id="setupScrim" hidden></div>

  <div class="toast" id="toast" hidden>
    <span id="toastText"></span>
    <button type="button" class="toast-undo" id="toastUndo">Undo</button>
  </div>

  <div class="sr-only" id="announcer" aria-live="polite" role="status"></div>
</div>
<script src="app.js"></script>
</body>
</html>
